name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.lock && pip install -e . --no-deps && pip install pytest pytest-asyncio ruff
      - run: pip install pip-audit && pip-audit -r requirements.lock
      - run: ruff check .
      - run: pytest -q
      - run: bash -n scripts/deploy_vps.sh
      - run: bash -n scripts/bootstrap_vps.sh
      - run: bash -n scripts/install_update_agent.sh
      - run: bash -n scripts/update_agent.sh
      - run: bash -n scripts/auto_update_agent.sh
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
  commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - run: python scripts/check_commit_messages.py --base "${{ github.event.pull_request.base.sha || github.event.before }}" --head "${{ github.sha }}"
  container-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/container_acceptance.py
